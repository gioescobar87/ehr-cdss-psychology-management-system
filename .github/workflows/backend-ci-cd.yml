name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/clinical-system/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: clarityehr-prod-backend
  CDK_STACK_NAME: ClarityEhrProductionStack
  BACKEND_IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-deploy:
    name: Build, Test, Push and Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/clinical-system/pom.xml

      - name: Run backend tests
        working-directory: backend/clinical-system
        run: ./mvnw test

      - name: Build backend application
        working-directory: backend/clinical-system
        run: ./mvnw clean package -DskipTests

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      
      - name: Check whether immutable image tag already exists
        id: image-check
        shell: bash
        run: |
          error_file=$(mktemp)

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$BACKEND_IMAGE_TAG" \
            >/dev/null 2>"$error_file"; then

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image tag already exists; reusing it."

          elif grep -q "ImageNotFoundException" "$error_file"; then

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image tag does not exist; it will be built and pushed."

          else
            cat "$error_file"
            rm -f "$error_file"
            echo "Unable to determine whether the image tag exists."
            exit 1
          fi

          rm -f "$error_file"

      - name: Build Docker image
        if: steps.image-check.outputs.exists == 'false'
        working-directory: backend/clinical-system
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$BACKEND_IMAGE_TAG" \
            .

      - name: Push Docker image to ECR
        if: steps.image-check.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$BACKEND_IMAGE_TAG"

      - name: Synthesize production infrastructure
        working-directory: infrastructure
        run: |
          npx cdk synth "$CDK_STACK_NAME" \
            -c backendImageTag="$BACKEND_IMAGE_TAG"

      - name: Deploy backend through CDK
        working-directory: infrastructure
        run: |
          npx cdk deploy "$CDK_STACK_NAME" \
            --require-approval never \
            -c backendImageTag="$BACKEND_IMAGE_TAG"

      - name: Verify ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster clarityehr-prod-cluster \
            --services clarityehr-prod-backend-service

      - name: Verify production HTTPS API
        run: |
          for attempt in {1..12}; do
            if response=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              https://api.clarityehr.app/actuator/health); then

              echo "$response"

              if echo "$response" | jq -e '.status == "UP"' >/dev/null; then
                exit 0
              fi
            fi

            echo "API health check attempt $attempt failed."
            sleep 10
          done

          echo "Production API health check failed."
          exit 1

      - name: Deployment summary
        run: |
          echo "Backend deployment completed successfully."
          echo "Image tag: $BACKEND_IMAGE_TAG"
          echo "CDK stack: $CDK_STACK_NAME"
          echo "API: https://api.clarityehr.app"

