name: Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: clarityehr-prod-backend
  ECR_CLUSTER: clarityehr-prod-cluster
  ECS_SERVICE: clarityehr-prod-backend-service

jobs:
  build-test-deploy:
    name: Build, Test, Push and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
      # Configure Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Run backend tests (if any)
      - name: Run backend tests
        working-directory: backend/clinical-system
        run: ./mvnw test
      # Build Spring Boot application
      - name: Build backend application
        working-directory: backend/clinical-system
        run: ./mvnw clean package -DskipTests
      # Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # Build DOcker image
      - name: Build Docker image
        working-directory: backend/clinical-system
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$BACKEND_IMAGE_TAG \
            .
      # Push Docker image
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$BACKEND_IMAGE_TAG
      # Set up Node.js for CDK
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json
      # Install CDK dependencies
      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci
      # Install AWS CDK CLI
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk
      # Verify CDK synthesis
      - name: CDK synth
        working-directory: infrastructure
        env:
          BACKEND_IMAGE_TAG: ${{ env.BACKEND_IMAGE_TAG }}
        run: |
            npx cdk synth \
              -c backendImageTag=$BACKEND_IMAGE_TAG
      # Deploy infrastructure
      - name: CDK deploy
        working-directory: infrastructure
        env:
          BACKEND_IMAGE_TAG: ${{ env.BACKEND_IMAGE_TAG }}
        run: |
          npx cdk deploy \
            --require-approval never \
            -c backendImageTag=$BACKEND_IMAGE_TAG
      # Veify ECS service
      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
      # Verify production HTTPS API
      - name: Verify production API
        run: |
          response=$(curl \
            --fail \
            --silent \
            --show-error \
            https://api.clarityehr.app/actuator/health)
          echo "$response"
          echo "$response" | grep -q '"status":"UP"'
      # Deployment summary
      - name: Deployment summary
        run: |
          echo "Backend deployment completed succesfully."
          echo "Image tag: $BACKEND_IMAGE_TAG"
          echo "API: https://api.clarityehr.app"
      
