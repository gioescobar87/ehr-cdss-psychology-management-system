name: Infrastructure CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECS_CLUSTER: clarityehr-prod-cluster
  ECS_SERVICE: clarityehr-prod-backend-service
  ECR_REPOSITORY: clarityehr-prod-backend
  CDK_STACK_NAME: ClarityEhrProductionStack

jobs:
  deploy-infrastructure:
    name: Synthesize and deploy production infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve currently deployed backend image tag
        id: backend-image
        run: |
          task_definition_arn=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$task_definition_arn" ] || \
             [ "$task_definition_arn" = "None" ]; then
            echo "Unable to determine the active ECS task definition."
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" \
            --query taskDefinition \
            --output json > current-task-definition.json

          image=$(jq -er --arg repo "/$ECR_REPOSITORY:" '
            [.containerDefinitions[] |
              select(.image | contains($repo)) |
              .image] |
            if length == 1 then .[0]
            else error("Expected exactly one backend image")
            end
          ' current-task-definition.json)

          case "$image" in
            *@*)
              echo "The deployed image uses a digest instead of a tag."
              echo "Resolve a matching ECR tag before deploying this stack."
              exit 1
              ;;
            *:*)
              image_tag="${image##*:}"
              ;;
            *)
              echo "The deployed backend image has no identifiable tag."
              exit 1
              ;;
          esac

          if [ -z "$image_tag" ]; then
            echo "Resolved backend image tag is empty."
            exit 1
          fi

          echo "Using currently deployed backend image tag: $image_tag"
          echo "backend_image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Synthesize production infrastructure
        working-directory: infrastructure
        env:
          BACKEND_IMAGE_TAG: ${{ steps.backend-image.outputs.backend_image_tag }}
        run: |
          npx cdk synth "$CDK_STACK_NAME" \
            -c backendImageTag="$BACKEND_IMAGE_TAG"

      - name: Deploy production infrastructure
        working-directory: infrastructure
        env:
          BACKEND_IMAGE_TAG: ${{ steps.backend-image.outputs.backend_image_tag }}
        run: |
          npx cdk deploy "$CDK_STACK_NAME" \
            --require-approval never \
            -c backendImageTag="$BACKEND_IMAGE_TAG"

      - name: Verify ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify production HTTPS API
        run: |
          for attempt in {1..12}; do
            if response=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              https://api.clarityehr.app/actuator/health); then

              echo "$response"

              if echo "$response" | jq -e '.status == "UP"' >/dev/null; then
                exit 0
              fi
            fi

            echo "API health check attempt $attempt failed."
            sleep 10
          done

          echo "Production API health check failed."
          exit 1

      - name: Deployment summary
        env:
          BACKEND_IMAGE_TAG: ${{ steps.backend-image.outputs.backend_image_tag }}
        run: |
          echo "Infrastructure deployment completed successfully."
          echo "CDK stack: $CDK_STACK_NAME"
          echo "Preserved backend image tag: $BACKEND_IMAGE_TAG"