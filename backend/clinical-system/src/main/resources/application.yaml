spring:
  application:
    name: clinical-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
    issuer: ${JWT_ISSUER:clinical-system}

  encryption:
    key: ${ENCRYPTION_KEY}

logging:
  level:
    "[org.hibernate.SQL]": INFO
    "[org.hibernate.orm.jdbc.bind]": INFO
    "[org.springframework.web.servlet.mvc.method.annotation]": INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info