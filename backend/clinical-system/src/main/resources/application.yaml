spring:
  application:
    name: clinical-system
  profiles:
    active: dev

security:
  jwt:
    secret: ${JSW_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
    issuer: ${JWT_ISSUER:clinical-system}
    #SECRET ATTRIBUTES: STRONG - PRIVATE - OVER 256 BITS LENGTH
    #IF THAT CRITERA IS MET, FORGERY IS COMPUTATIONALLY INFEASIBLE